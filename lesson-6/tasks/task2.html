    <h2>Задача 2</h2>
    <p>
      Вивести на екран <br>
      1 1 <br>
      2 1234 <br>
      3 123456789 <br>
      4 1234…16 <br>
      5 1 … 25 <br>
      6 1…36 <br>
      -------------------------- <br>
    </p>
    <script>
      if (confirm('Почати тестування?')) {
        let num = 1
        // 1 вводимо дані  
        for (let numRow = 1; numRow <= 6; numRow++) {
          let sumNum = numRow * numRow
          for (let numCol = 1; numCol <= sumNum; numCol++) {

            document.write(`${numCol} `)
          }
          document.write(`<br>`)
        }

        // 3 Виводимо результат   
      }
    </script>
  </div>
