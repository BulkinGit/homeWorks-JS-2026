<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../css/style.css">
  <title>Document</title>
</head>

<body>
  <div class="block">
    <h2>Задача 9</h2>
    <p>
      Дано масив цін у грн. Податок складає 20%. Сформувати масив, який буде містити величину сплаченого податку у
      грн.
    </p>
    <script>
      if (confirm('Почати тестування?')) {

        // 1 вводимо дані
        let userPrice = parseInt(prompt('введіть число:', 5))
        let arrPrice = Array.from({
          length: userPrice
        }, () => 10 + Math.floor(Math.random() * (150 - 10 + 1)))

        let priceProc = arrPrice.map(el => (el * 0.2).toFixed(2))
        // 3 Виводимо результат

        document.write(`Податок від ціни: ${priceProc}`)

        console.log(arrPrice)
        console.log(priceProc)
      }
    </script>
  </div>
</body>

</html>
