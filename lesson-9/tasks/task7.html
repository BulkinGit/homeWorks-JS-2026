<body>
  <div class="block">
    <h2>Задача 7</h2>
    <p>
      Дано масив номерів авто. Сформувати новий масив тих, які починаються на «А»
    </p>
    <script>
      if (confirm('Почати тестування?')) {

        // 1 вводимо дані
        const carNumbers = ["АА2332АА", "ВС1205СА", "К-23", "СВ9432КА", "АХ1205СВ", "КА1205СК", "аА-120", "05СК"]
        // 3 Виводимо результат
        let numbersFilter = carNumbers.filter((item) => item[0] === 'А')


        document.write(`
        ${numbersFilter}
                `)

        console.log(carNumbers)
        console.log(numbersFilter)

      }
    </script>
  </div>
