<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../css/style.css">
  <title>Document</title>
</head>

<body>
  <div class="block">
    <h2>Задача 2</h2>
    <p>
      Вивести з використанням циклів маркований список з випадковими числами (1-100). <br>
      Кількість випадкових чисел вводиться користувачем.
    </p>
    <script>
      if (confirm('Почати тестування?')) {
        // 1 вводимо дані   
        const itemNum = parseInt(prompt(`Веедіть кількість пунктів числом:`, '5'))
        document.write('<ul>')
        for (let i = 0; i < itemNum; i++) {
          let randomNum = 1 + Math.floor(Math.random() * 100)
          document.write(`<li>${randomNum}</li>`)
        }
        document.write('</ul>')

        // 3 Виводимо результат  

      }
    </script>
  </div>
</body>

</html>
