<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../css/style.css">
  <title>Document</title>
</head>

<body>
  <div class="block">
    <h2>Задача 4</h2>
    <p>
      Вивести 4 таблиці (по 4 рядки і 4 стовпці у кожній) за зразком
    </p>
    <script>
      if (confirm('Почати тестування?')) {

        // 2 будуємо обчислення    
        for (let tableNum = 1; tableNum <= 4; tableNum++) {
          document.write(`<h2>${tableNum}</h2>`)
          // table start
          document.write(`<table style="border: 1px solid black;">
                          <tbody>`)
          for (let rowNum = 0; rowNum < 4; rowNum++) {
            document.write(`<tr>`)

            for (let colNum = 0; colNum < 4; colNum++) {
              let randNum = 1 + Math.floor(Math.random() * (50))

              document.write(`<td style="border: 1px solid black;">${randNum}</td>`)
            }

            document.write(`</tr>`)
          }
          // table end
          document.write(`</tbody>
                          </table>`)
        }

        // document.write(``)


        // 3 Виводимо результат   
      }
    </script>
  </div>
</body>

</html>
